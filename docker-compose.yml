services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    container_name: url_hashing_app-sqlserver-1
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DevShorten@2026!
      - MSSQL_PID=Developer
      - MSSQL_MEMORY_LIMIT_MB=2048 # Limits SQL engine internally to ~2GB
    deploy:
      resources:
        limits:
          memory: 3000M # Hard cap for the container to prevent OOM (Exit 137)
        reservations:
          memory: 2500M
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql # Persistent volume to save upgrade progress
      - ./sql-scripts:/usr/config/sql-scripts
    networks:
      - app-network
    restart: always
    entrypoint: /bin/bash /usr/config/sql-scripts/entrypoint.sh
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "DevShorten@2026!",
          "-Q",
          "SELECT 1",
          "-C",
        ]
      interval: 20s
      timeout: 10s
      retries: 20 # Increased to handle first-time DB version upgrades
      start_period: 60s # Gives the DB a full minute to boot before checking health

  api-node:
    build: ./Backend
    deploy:
      replicas: 5
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 400M
    environment:
      - DB_SERVER=sqlserver
      - DB_NAME=UrlShortenerDB
      - DB_USER=sa
      - DB_PASSWORD=DevShorten@2026!
      - REDIS_HOST=redis_service
      - REDIS_PORT=6379
      - PORT=3000
      - JWT_SECRET=K7gP2vX9mL4nQ8zJ1wR6tB5yS3hF0kC9uA1dB8eG7iN4oP3qS5zM2xL1wV9n
      - JWT_EXPIRES_IN=1h
      - NODE_ENV=development
    networks:
      - app-network
    depends_on:
      sqlserver:
        condition: service_healthy # Wait for DB to be fully ready/upgraded
      redis_service:
        condition: service_started
    restart: always

  frontend-app:
    build: ./Frontend
    ports:
      - "80:80"
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 200M

  redis_service:
    image: redis:alpine
    networks:
      - app-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 200M

networks:
  app-network:
    driver: bridge

volumes:
  mssql_data:
