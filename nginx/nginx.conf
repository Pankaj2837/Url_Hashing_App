events { worker_connections 10000; } # Essential for high-concurrency

http {
    upstream backend_cluster {
        least_conn; # Distributes load to the least busy instance
        server api-node-1:3000;
        server api-node-2:3000;
        server api-node-3:3000;
        server api-node-4:3000;
        server api-node-5:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Proxy API requests to backend cluster
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }

        # Default - should serve frontend or 404
        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
        }
    }
}